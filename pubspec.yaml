name: votacion_delegado_ec
description: "Aplicación de votación para elegir delegados estudiantiles de la Universidad Continental"
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.10.7

dependencies:
  flutter:
    sdk: flutter
  
  # Firebase
  firebase_core: ^2.27.0
  firebase_auth: ^4.17.0
  cloud_firestore: ^4.15.0
  
  # State Management
  provider: ^6.1.2
  rxdart: ^0.27.7
  flutter_native_splash: ^2.4.1
  geolocator: ^10.1.0
  google_sign_in: ^6.2.1
  
  # UI
  cupertino_icons: ^1.0.8
  font_awesome_flutter: ^10.7.0
  google_fonts: ^6.2.1
  cached_network_image: ^3.3.1
  
  # Utilities
  shared_preferences: ^2.2.3
  crypto: ^3.0.3

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/
